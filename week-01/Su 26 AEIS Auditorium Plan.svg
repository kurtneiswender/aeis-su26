<?xml version="1.0" encoding="UTF-8"?>
<!--
  ARC 5443 · 500-Seat Proscenium Auditorium · Schematic Floor Plan
  Seating: 3 sections · 6 left + 13 center + 6 right = 25 seats/row × 20 rows = 500 total
  Grid: seat tile 18 × 13 px · section x-starts at multiples of 18 · row y-start at multiple of 13
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-28 -18 980 760">
<defs>

  <!-- ── Seat tile: 18 px wide × 13 px tall ──
       Pattern aligns at x=198 (11×18), x=342 (19×18), x=612 (34×18), y=299 (23×13) -->
  <pattern id="sg" x="0" y="0" width="18" height="13" patternUnits="userSpaceOnUse">
    <rect x="1.5" y="2" width="15" height="9" rx="1.5"
          fill="rgba(159,200,212,0.28)" stroke="#9FC8D4" stroke-width="0.7"/>
  </pattern>

  <!-- BOH diagonal hatch -->
  <pattern id="boh-x" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45 0 0)">
    <line x1="0" y1="0" x2="0" y2="9" stroke="rgba(237,228,211,0.09)" stroke-width="0.9"/>
  </pattern>

  <!-- Stage diagonal hatch (amber) -->
  <pattern id="stg-x" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45 0 0)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="rgba(212,162,76,0.20)" stroke-width="1"/>
  </pattern>

</defs>

